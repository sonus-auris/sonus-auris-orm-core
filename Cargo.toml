[package]
name = "sonus-auris-orm-core"
version = "0.1.0"
edition = "2021"
description = "Shared SeaORM entity/query crate for sonus-auris. Schema imported from oresoftware/k8s-libs-and-shared-defs."
repository = "https://github.com/sonus-auris/sonus-auris-orm-core"
publish = false

[lib]
name = "sonus_auris_orm_core"

[features]
# Web servers use the default (read-only) surface.
# API servers opt into the write surface explicitly.
default = ["read-only"]
read-only = []
read-write = ["read-only"]

[dependencies]
sea-orm = { version = "1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-uuid",
] }
