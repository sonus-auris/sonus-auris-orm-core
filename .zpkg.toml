[package]
org = "sonus-auris"
name = "sonus-auris-orm-core"
version = "0.1.0"
description = "Canonical opaque SeaORM boundary for the sonus-auris organization"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/sonus-auris/sonus-auris-orm-core"

[dependencies]
"oresoftware/k8s-libs-and-shared-defs" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  ".env",
  ".env.*",
  ".vendor/.zed/**",
  "target/**",
  "**/*.log",
]

[install]
dir = ".vendor/.zed"

[targets.rust]
dir = "."
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "sonus-auris-orm-core"

[scripts]
format = "cargo fmt --all -- --check"
lint = "cargo clippy --all-targets --all-features -- -D warnings"
test-default = "cargo test --all-targets"
test-read-write = "cargo test --all-targets --all-features"
test-doc = "cargo test --doc"
